<script>
  /* EDS §8.1 双语 helper（字符串拼接，避免模板字符串与测试注入冲突） */
  const swalTitle = (cn, en) => cn + '<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">' + en + '</span>';
  const swalHtml  = (cn, en) => '<div>' + cn + '<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">' + en + '</div></div>';

  /* 审批级别：1 = 工序经理（process 队列），2 = 部门经理（dept 队列） */
  var STRATEGY_APPROVAL_LEVELS = {
    1: {
      queue: 'process',
      titleCn: '工序经理审批',
      titleEn: 'Process Manager Approval',
      sectionCn: '待审批策略（工序经理）',
      sectionEn: 'PENDING STRATEGIES (PROCESS MANAGER)'
    },
    2: {
      queue: 'dept',
      titleCn: '部门经理审批',
      titleEn: 'Department Manager Approval',
      sectionCn: '待审批策略（部门经理）',
      sectionEn: 'PENDING STRATEGIES (DEPARTMENT MANAGER)'
    }
  };

  /* 页面状态：当前队列行（与表格 data-index 对应） */
  var strategyApprovalRows = [];

  /* null/undefined → ''，其余转字符串并 trim */
  function strategyApprovalText_(value) {
    if (value === null || value === undefined) return '';
    return String(value).trim();
  }

  /* 审批级别归一化：只接受 1 / 2，其余按 1 处理 */
  function strategyApprovalLevelKey_(level) {
    return parseInt(level, 10) === 2 ? 2 : 1;
  }

  /* 级别配置 */
  function strategyApprovalLevelConfig_(level) {
    return STRATEGY_APPROVAL_LEVELS[strategyApprovalLevelKey_(level)];
  }

  /* 共享转义 helper 缺失时退化为本地实现 */
  function strategyApprovalEscape_(value) {
    if (typeof strategyEscapeHtml === 'function') return strategyEscapeHtml(value);
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * 解析 History「Operator」列：
   * `工号/ JobNumber:  {jobNo}_姓名/ Name:  {name} {yyyy-MM-dd HH:mm:ss}`
   * 返回姓名与提交时间（解析失败时退回原文 / 空串）。
   * @param {string} operator
   * @returns {{jobNumber:string,name:string,timestamp:string}}
   */
  function parseStrategyApprovalOperator_(operator) {
    var text = strategyApprovalText_(operator);
    var result = { jobNumber: '', name: '', timestamp: '' };
    if (text === '') return result;

    var jobMatch = text.match(/JobNumber:\s*([^_]+)/);
    if (jobMatch) result.jobNumber = jobMatch[1].trim();

    var timeMatch = text.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\s+\d{1,2}:\d{2}:\d{2})\s*$/);
    if (timeMatch) result.timestamp = timeMatch[1];

    var nameMatch = text.match(/Name:\s*(.+)$/);
    if (nameMatch) {
      result.name = nameMatch[1];
      if (result.timestamp !== '') {
        result.name = result.name.replace(/\s*\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\s+\d{1,2}:\d{2}:\d{2}\s*$/, '');
      }
      result.name = result.name.trim();
    }
    if (result.name === '') result.name = result.jobNumber;
    return result;
  }

  /* 解析 `Strategy Content` JSON；空值/非法 JSON 返回 null */
  function strategyApprovalContent_(row) {
    if (!row) return null;
    var raw = row['Strategy Content'];
    if (raw === null || raw === undefined || raw === '') return null;
    if (typeof raw === 'object') return raw;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  /* 展示字段：新增/修改取 new，作废取 old */
  function strategyApprovalFields_(content) {
    if (content && content.new) return content.new;
    if (content && content.old) return content.old;
    return {};
  }

  /* 申请类型标签：共享 helper 缺失时本地实现 */
  function strategyApprovalActionLabel_(content) {
    if (typeof strategyActionLabel === 'function') return strategyActionLabel(content);
    var hasOld = !!(content && content.old);
    var hasNew = !!(content && content.new);
    if (hasOld && hasNew) return '修改 / Edit';
    if (hasOld) return '作废 / Void';
    return '新增 / Create';
  }

  /**
   * 构造 saveStrategyApproval payload。
   * `operator` 必须原样传递（后端按 Operator 精确匹配 History 行）；
   * row 或 row.Operator 缺失时返回 null。
   * @param {Object} row History 行
   * @param {string} decision `approve` | `reject`
   * @param {string} comment 审批意见（选填）
   * @param {number} level 1 | 2
   * @param {{jobNumber:string,name:string}} user
   * @returns {{jobNumber:string,name:string,operator:string,level:number,decision:string,comment:string}|null}
   */
  function buildStrategyApprovalPayload(row, decision, comment, level, user) {
    if (!row) return null;
    var operator = row.Operator;
    if (operator === null || operator === undefined || String(operator) === '') return null;
    var account = user || {};
    return {
      jobNumber: strategyApprovalText_(account.jobNumber),
      name: strategyApprovalText_(account.name),
      operator: String(operator),
      level: level,
      decision: strategyApprovalText_(decision),
      comment: strategyApprovalText_(comment)
    };
  }

  /* 行内操作按钮（图标 + 文字，符合 UI 规范 §4.7 按钮图标化） */
  function strategyApprovalActionButtonsHtml_(index) {
    var html = '<div class="d-flex justify-content-center gap-1 flex-wrap">';
    html += '<button type="button" class="btn btn-sm btn-info strategy-approval-detail-btn strategy-approval-action-btn" data-strategy-approval-index="' + index + '" title="详情 / Detail"><i class="bi bi-list-ul"></i> 详情 / Detail</button>';
    html += '<button type="button" class="btn btn-sm btn-success strategy-approval-approve-btn strategy-approval-action-btn" data-strategy-approval-index="' + index + '" title="批准 / Approve"><i class="bi bi-check-lg"></i> 批准 / Approve</button>';
    html += '<button type="button" class="btn btn-sm btn-danger strategy-approval-reject-btn strategy-approval-action-btn" data-strategy-approval-index="' + index + '" title="拒绝 / Reject"><i class="bi bi-x-lg"></i> 拒绝 / Reject</button>';
    html += '</div>';
    return html;
  }

  /* 渲染待办表格：工序 / 机型 / 策略描述 / 频率 / 申请类型 / 申请人 / 提交时间 / 变更原因 / 操作 */
  function renderStrategyApprovalTable($, rows) {
    strategyApprovalRows = Array.isArray(rows) ? rows : [];
    var escape = strategyApprovalEscape_;
    var html = '';
    if (strategyApprovalRows.length === 0) {
      html = '<tr><td colspan="9" class="text-muted">暂无待审批策略 / No pending strategy</td></tr>';
    } else {
      for (var i = 0; i < strategyApprovalRows.length; i++) {
        var row = strategyApprovalRows[i] || {};
        var content = strategyApprovalContent_(row);
        var fields = strategyApprovalFields_(content);
        var applicant = parseStrategyApprovalOperator_(row.Operator);
        html += '<tr>';
        html += '<td>' + escape(row.Process) + '</td>';
        html += '<td>' + escape(row.MachineType) + '</td>';
        html += '<td class="text-start">' + escape(fields['PM Description']) + '</td>';
        html += '<td>' + escape(fields['PM Frequency']) + '</td>';
        html += '<td>' + escape(strategyApprovalActionLabel_(content)) + '</td>';
        html += '<td>' + escape(applicant.name) + '</td>';
        html += '<td>' + escape(applicant.timestamp) + '</td>';
        html += '<td class="text-start">' + escape(row.Reason) + '</td>';
        html += '<td>' + strategyApprovalActionButtonsHtml_(i) + '</td>';
        html += '</tr>';
      }
    }
    $('#strategyApprovalTableBody').html(html);
  }

  /* 差异表 HTML：修改/新增显示旧值+新值并标注变更行；作废仅显示旧值 */
  function strategyApprovalDiffHtml_(content) {
    var hasNew = !!(content && content.new);
    var oldFields = content ? content.old : null;
    var newFields = hasNew ? content.new : null;
    var rows = typeof strategyDiffRows === 'function' ? strategyDiffRows(oldFields, newFields) : [];
    var html = '<div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0" id="strategyApprovalDiffTable">';
    html += '<thead><tr>';
    html += '<th>字段<br><small>Field</small></th>';
    html += '<th>原值<br><small>Old Value</small></th>';
    if (hasNew) {
      html += '<th>新值<br><small>New Value</small></th>';
      html += '<th>状态<br><small>Status</small></th>';
    }
    html += '</tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var diff = rows[i] || {};
      var changed = hasNew && diff.changed;
      html += '<tr' + (changed ? ' class="table-warning"' : '') + '>';
      html += '<td class="text-start">' + strategyApprovalEscape_(diff.label) + '</td>';
      html += '<td class="text-start">' + strategyApprovalEscape_(diff.oldValue) + '</td>';
      if (hasNew) {
        html += '<td class="text-start">' + strategyApprovalEscape_(diff.newValue) + '</td>';
        html += '<td>' + (changed
          ? '<span class="badge bg-warning text-dark">已变更 / Changed</span>'
          : '<span class="text-muted">—</span>') + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  /* 详情弹窗：基础信息 + 差异表 */
  function showStrategyApprovalDetail_(index) {
    var row = strategyApprovalRows[index];
    if (!row) return;
    var content = strategyApprovalContent_(row);
    var fields = strategyApprovalFields_(content);
    var applicant = parseStrategyApprovalOperator_(row.Operator);
    var escape = strategyApprovalEscape_;
    var info = '<div style="text-align:left;font-size:13px;line-height:1.7;margin-bottom:10px;">';
    info += '<div><strong>工序 / Process:</strong> ' + escape(row.Process) + '</div>';
    info += '<div><strong>机型 / Machine Type:</strong> ' + escape(row.MachineType) + '</div>';
    info += '<div><strong>策略描述 / PM Description:</strong> ' + escape(fields['PM Description']) + '</div>';
    info += '<div><strong>频率 / PM Frequency:</strong> ' + escape(fields['PM Frequency']) + '</div>';
    info += '<div><strong>申请类型 / Request Type:</strong> ' + escape(strategyApprovalActionLabel_(content)) + '</div>';
    info += '<div><strong>申请人 / Applicant:</strong> ' + escape(applicant.name) + '</div>';
    info += '<div><strong>提交时间 / Submitted At:</strong> ' + escape(applicant.timestamp) + '</div>';
    info += '<div><strong>变更原因 / Reason:</strong> ' + escape(row.Reason) + '</div>';
    info += '</div>';
    Swal.fire({
      title: swalTitle('策略详情', 'Strategy Detail'),
      html: info + strategyApprovalDiffHtml_(content),
      width: '90%',
      showCloseButton: true,
      confirmButtonText: '确定 / OK'
    });
  }

  /* 失败提示：把后端「中文 / English」消息拆成双语 swalHtml */
  function showStrategyApprovalError_(message) {
    var text = strategyApprovalText_(message);
    var cn = '后端返回异常，请重试。';
    var en = 'Backend error, please retry.';
    if (text !== '') {
      cn = text;
      en = text;
      var parts = text.split(' / ');
      if (parts.length >= 2) {
        cn = parts[0];
        en = parts.slice(1).join(' / ');
      }
    }
    Swal.close();
    Swal.fire({
      icon: 'error',
      title: swalTitle('操作失败', 'Failed'),
      html: swalHtml(cn, en),
      confirmButtonText: '确定 / OK'
    });
  }

  /* 实际提交：调用 saveStrategyApproval，成功后刷新队列 */
  function submitStrategyApprovalRequest_($, payload, level) {
    Swal.fire({
      title: swalTitle('请等待', 'Please Wait'),
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => Swal.showLoading()
    });

    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) {
          Swal.fire({
            icon: 'success',
            title: swalTitle('操作成功', 'Success'),
            timer: 1500,
            showConfirmButton: false
          });
          loadStrategyApprovalQueue($, level);
        } else {
          // 后端返回「没有工序经理审批权限」「工序经理已审批」等具体原因
          showStrategyApprovalError_(r && r.message ? r.message : '');
        }
      })
      .withFailureHandler(function () {
        showStrategyApprovalError_('后端返回异常，请重试。/ Backend error, please retry.');
      })
      .saveStrategyApproval(payload);
  }

  /* 批准/拒绝弹窗：审批意见选填；确认后构造 payload 并提交 */
  function promptStrategyApprovalDecision_($, index, decision, level) {
    var row = strategyApprovalRows[index];
    if (!row) return;
    var isApprove = decision === 'approve';
    Swal.fire({
      icon: isApprove ? 'info' : 'warning',
      title: swalTitle(isApprove ? '确认批准？' : '确认拒绝？', isApprove ? 'Confirm Approve?' : 'Confirm Reject?'),
      html: swalHtml(
        isApprove ? '可填写审批意见（选填）。' : '可填写拒绝原因（选填）。',
        isApprove ? 'You may add an optional comment.' : 'You may add an optional reason.'
      ),
      input: 'textarea',
      inputPlaceholder: '审批意见（选填）/ Comment (optional)',
      showCancelButton: true,
      confirmButtonText: isApprove ? '批准 / Approve' : '拒绝 / Reject',
      cancelButtonText: '取消 / Cancel',
      confirmButtonColor: isApprove ? '#198754' : '#E60012'
    }).then(function (result) {
      if (!result || !result.isConfirmed) return;
      var comment = result.value === null || result.value === undefined ? '' : result.value;
      var payload = buildStrategyApprovalPayload(row, decision, comment, level, {
        jobNumber: typeof STRATEGY_JOB_NUMBER !== 'undefined' ? STRATEGY_JOB_NUMBER : '',
        name: typeof STRATEGY_USER_NAME !== 'undefined' ? STRATEGY_USER_NAME : ''
      });
      if (payload === null) {
        showStrategyApprovalError_('审批记录缺少操作人信息，请刷新后重试。/ Approval record is missing operator information.');
        return;
      }
      submitStrategyApprovalRequest_($, payload, level);
    });
  }

  /* 用户栏：优先取 URL 注入值，其次取后端返回的 user */
  function renderStrategyApprovalUser_($, user) {
    var userName = typeof STRATEGY_USER_NAME !== 'undefined' && STRATEGY_USER_NAME ? String(STRATEGY_USER_NAME) : '';
    var jobNumber = typeof STRATEGY_JOB_NUMBER !== 'undefined' && STRATEGY_JOB_NUMBER ? String(STRATEGY_JOB_NUMBER) : '';
    if (userName === '' && user && user.name) userName = String(user.name);
    if (jobNumber === '' && user && user.jobNumber) jobNumber = String(user.jobNumber);
    $('#Name').text(userName === '' ? '-' : userName);
    $('#JobNumber').text(jobNumber);
  }

  /* 读取待办队列：level 1 → process，level 2 → dept */
  function loadStrategyApprovalQueue($, level) {
    var config = strategyApprovalLevelConfig_(level);
    $('#strategyApprovalTableBody').html('<tr><td colspan="9" class="text-muted">加载中 / Loading...</td></tr>');
    google.script.run
      .withSuccessHandler(function (r) {
        renderStrategyApprovalUser_($, r && r.user ? r.user : null);
        renderStrategyApprovalTable($, r && r.rows ? r.rows : []);
      })
      .withFailureHandler(function () {
        strategyApprovalRows = [];
        renderStrategyApprovalTable($, []);
        showStrategyApprovalError_('待办加载失败，请刷新重试。/ Failed to load work queue, please refresh.');
      })
      .getStrategyWorkQueue(config.queue, typeof STRATEGY_JOB_NUMBER !== 'undefined' ? STRATEGY_JOB_NUMBER : '');
  }

  /**
   * 审批页初始化（工序经理 / 部门经理共用）
   * @param {number} level 1 = 工序经理，2 = 部门经理
   */
  function initStrategyApprovalPage(level) {
    var levelKey = strategyApprovalLevelKey_(level);
    var config = strategyApprovalLevelConfig_(levelKey);
    var $page = typeof $ !== 'undefined' ? $ : null;
    if (!$page) return;

    $('#title').text(config.titleCn + ' / ' + config.titleEn);
    $('#strategyApprovalSectionTitle').text(config.sectionCn + ' / ' + config.sectionEn);
    renderStrategyApprovalUser_($page, null);

    $('#strategyApprovalTableBody').on('click', '.strategy-approval-detail-btn', function () {
      var index = parseInt($(this).attr('data-strategy-approval-index'), 10);
      if (isNaN(index)) return;
      showStrategyApprovalDetail_(index);
    });
    $('#strategyApprovalTableBody').on('click', '.strategy-approval-approve-btn', function () {
      var index = parseInt($(this).attr('data-strategy-approval-index'), 10);
      if (isNaN(index)) return;
      promptStrategyApprovalDecision_($page, index, 'approve', levelKey);
    });
    $('#strategyApprovalTableBody').on('click', '.strategy-approval-reject-btn', function () {
      var index = parseInt($(this).attr('data-strategy-approval-index'), 10);
      if (isNaN(index)) return;
      promptStrategyApprovalDecision_($page, index, 'reject', levelKey);
    });

    loadStrategyApprovalQueue($page, levelKey);
  }
</script>

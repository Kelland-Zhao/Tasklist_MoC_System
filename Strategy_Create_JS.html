<script>
  /* EDS §8.1 双语 helper（字符串拼接，避免模板字符串与测试注入冲突） */
  const swalTitle = (cn, en) => cn + '<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">' + en + '</span>';
  const swalHtml  = (cn, en) => '<div>' + cn + '<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">' + en + '</div></div>';

  /* null/undefined → ''，其余转字符串并 trim */
  function strategyCreateText_(value) {
    if (value === null || value === undefined) return '';
    return String(value).trim();
  }

  /* 共享转义 helper 缺失时退化为本地实现 */
  function strategyCreateEscape_(value) {
    if (typeof strategyEscapeHtml === 'function') return strategyEscapeHtml(value);
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* 字段选择器：用 data 属性定位，避免中文字段名进入 id/选择器转义 */
  function strategyCreateFieldSelector_(key) {
    return '[data-strategy-field="' + String(key) + '"]';
  }

  /* 多选控件值统一为排序、去重、去空白的字符串数组 */
  function strategyCreateSelectedValues_(value) {
    var list = Array.isArray(value) ? value : (value === null || value === undefined || value === '' ? [] : [value]);
    var seen = {};
    var result = [];
    for (var i = 0; i < list.length; i++) {
      var text = strategyCreateText_(list[i]);
      if (text === '' || Object.prototype.hasOwnProperty.call(seen, text)) continue;
      seen[text] = true;
      result.push(text);
    }
    result.sort();
    return result;
  }

  /**
   * 收集 14 个业务字段值
   * @param {Function} $ jQuery
   * @returns {Object<string,string>}
   */
  function collectStrategyFormValues($) {
    var values = {};
    var fields = typeof STRATEGY_FIELDS !== 'undefined' && STRATEGY_FIELDS ? STRATEGY_FIELDS : [];
    for (var i = 0; i < fields.length; i++) {
      var key = fields[i].key;
      var $input = $(strategyCreateFieldSelector_(key));
      var value = '';
      if ($input && $input.length) value = $input.val();
      if (fields[i].type === 'multiselect') {
        values[key] = formatStrategyTasklistNames(strategyCreateSelectedValues_(value));
      } else {
        values[key] = value === null || value === undefined ? '' : String(value);
      }
    }
    return values;
  }

  /**
   * 构造 submitStrategyNew payload；必填字段或变更原因缺失/空白时返回 null
   * @param {Object<string,string>} values 14 个业务字段
   * @param {{jobNumber:string,name:string}} user
   * @param {string} reason 变更原因
   * @returns {{jobNumber:string,name:string,fields:Object,reason:string}|null}
   */
  function buildStrategyCreatePayload(values, user, reason) {
    var fields = strategyNormalizeConditionalFields(values || {});
    var account = user || {};
    var jobNumber = strategyCreateText_(account.jobNumber);
    var name = strategyCreateText_(account.name);
    var reasonText = strategyCreateText_(reason);
    if (jobNumber === '' || reasonText === '') return null;
    var requiredKeys = strategyRequiredKeysFor(fields);
    for (var i = 0; i < requiredKeys.length; i++) {
      if (strategyCreateText_(fields[requiredKeys[i]]) === '') return null;
    }
    var snapshot = {};
    for (var key in fields) {
      if (Object.prototype.hasOwnProperty.call(fields, key)) snapshot[key] = fields[key];
    }
    return {
      jobNumber: jobNumber,
      name: name,
      fields: snapshot,
      reason: reasonText
    };
  }

  /* 字段 DOM id（按 STRATEGY_FIELDS 顺序，避免中文字段名进 id） */
  function strategyCreateFieldId_(index) {
    return 'strategyField' + index;
  }

  /* 条件字段的 * 标记先全部渲染，再由 applyStrategyCreateConditionalState 按值显隐 */
  function strategyCreateRequiredMarkHtml_(key) {
    var initiallyRequired = strategyRequiredKeysFor({}).indexOf(key) !== -1;
    return '<span class="req" data-strategy-required="' + key + '"' +
      (initiallyRequired ? '' : ' style="display:none;"') + '>*</span>';
  }

  function strategyCreateRequiredMarkerSelector_(key) {
    return '[data-strategy-required="' + String(key) + '"]';
  }

  /* 单个字段的 label + 控件 HTML */
  function strategyCreateFieldHtml_(field, index) {
    var id = strategyCreateFieldId_(index);
    var requiredMark = strategyCreateRequiredMarkHtml_(field.key);
    var html = '<div class="col-md-6 col-xl-4 mb-3">';
    html += '<label class="field-label" for="' + id + '">' + field.label + requiredMark;
    html += '<span class="en">' + field.labelEn + '</span></label>';
    if (field.type === 'select') {
      html += '<select class="form-select" id="' + id + '" data-strategy-field="' + field.key + '">';
      html += '<option value="">请选择 / Please select</option>';
      var options = field.options || [];
      for (var i = 0; i < options.length; i++) {
        html += '<option value="' + options[i] + '">' + options[i] + '</option>';
      }
      html += '</select>';
    } else if (field.type === 'multiselect') {
      html += '<select multiple class="form-select" size="6" id="' + id + '" data-strategy-field="' + field.key + '"></select>';
    } else {
      html += '<input type="text" class="form-control" id="' + id + '" data-strategy-field="' + field.key + '" placeholder="请输入 / Enter">';
    }
    html += '</div>';
    return html;
  }

  /* 按 STRATEGY_FIELDS 渲染 14 个字段（中文在上、英文在下） */
  function renderStrategyForm($) {
    var html = '';
    var fields = typeof STRATEGY_FIELDS !== 'undefined' && STRATEGY_FIELDS ? STRATEGY_FIELDS : [];
    for (var i = 0; i < fields.length; i++) {
      html += strategyCreateFieldHtml_(fields[i], i);
    }
    $('#strategyForm').html(html);
  }

  /* 选项统一为 {value,label}；兼容旧的纯字符串数组（label = value） */
  function strategyCreateNormalizeTasklistOptions_(options) {
    var list = Array.isArray(options) ? options : [];
    var result = [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var value = '';
      var label = '';
      if (item && typeof item === 'object') {
        value = strategyCreateText_(item.value);
        label = item.label === null || item.label === undefined ? value : strategyCreateText_(item.label);
      } else {
        value = strategyCreateText_(item);
        label = value;
      }
      if (value === '') continue;
      result.push({ value: value, label: label === '' ? value : label });
    }
    return result;
  }

  /* 追加选项后刷新 Select2；未初始化或未加载 Select2 时静默跳过 */
  function refreshStrategyCreateTasklistSelect2_($, $select) {
    if (!$select || !$select.length) return;
    if (typeof $select.hasClass !== 'function') return;
    if (!$select.hasClass('select2-hidden-accessible')) return;
    $select.trigger('change.select2');
  }

  /* 给 TasklistName 多选追加选项（跳过空白与已存在项），标签带工序前缀 */
  function appendStrategyCreateTasklistOptions_($, $select, options) {
    if (!$select || !$select.length) return;
    var existing = {};
    $select.find('option').each(function () {
      existing[String(this.value)] = true;
    });
    var list = strategyCreateNormalizeTasklistOptions_(options);
    var html = '';
    for (var i = 0; i < list.length; i++) {
      if (Object.prototype.hasOwnProperty.call(existing, list[i].value)) continue;
      existing[list[i].value] = true;
      html += '<option value="' + strategyCreateEscape_(list[i].value) + '">' +
        strategyCreateEscape_(list[i].label) + '</option>';
    }
    if (html !== '') $select.append(html);
    refreshStrategyCreateTasklistSelect2_($, $select);
  }

  /* TasklistName 多选初始化 Select2；重复调用或未加载 Select2 时静默跳过 */
  function initStrategyCreateTasklistSelect2_($, $select) {
    if (!$select || !$select.length) return;
    if (typeof $select.select2 !== 'function') return;
    if (typeof $select.hasClass === 'function' && $select.hasClass('select2-hidden-accessible')) return;
    $select.select2({
      theme: 'bootstrap-5',
      placeholder: '请选择 / Please select',
      width: '100%',
      closeOnSelect: false,
      allowClear: false
    });
  }

  /* 读取当前生效任务清单并填充 TasklistName 多选；失败时提示并保持为空 */
  function loadStrategyCreateTasklistOptions($) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) {
          var $select = $(strategyCreateFieldSelector_('TasklistName'));
          appendStrategyCreateTasklistOptions_($, $select, r.options || []);
          initStrategyCreateTasklistSelect2_($, $select);
        } else {
          showStrategyCreateError_(r && r.message
            ? r.message
            : '任务清单加载失败，请刷新重试。/ Failed to load tasklist names, please refresh.');
        }
      })
      .withFailureHandler(function () {
        showStrategyCreateError_('任务清单加载失败，请刷新重试。/ Failed to load tasklist names, please refresh.');
      })
      .getStrategyTasklistNames();
  }

  /* 频率文本 → 月数；helper 缺失时按无法识别处理 */
  function strategyCreateFrequencyMonths_(text) {
    if (typeof convertFrequencyToMonths === 'function') return convertFrequencyToMonths(text);
    return null;
  }

  /* PM Frequency 变化：仅 RBM 回填强制保养频率，可识别则填入，否则加黄色提醒 */
  function updateStrategyMandatoryFrequency($) {
    var strategy = strategyCreateText_($(strategyCreateFieldSelector_('策略 / Strategy')).val());
    var $target = $(strategyCreateFieldSelector_('强制保养频率/ Month'));
    if (strategy !== 'RBM') {
      $target.val('NA');
      $target.removeClass('bg-warning');
      return;
    }
    var months = strategyCreateFrequencyMonths_($(strategyCreateFieldSelector_('PM Frequency')).val());
    if (months === null) {
      $target.addClass('bg-warning');
    } else {
      $target.val(String(months));
      $target.removeClass('bg-warning');
    }
  }

  /* 条件字段启用/禁用 + NA 规范化 + * 标记显隐 */
  function applyStrategyCreateConditionalGroup_($, keys, required) {
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var $input = $(strategyCreateFieldSelector_(key));
      var $marker = $(strategyCreateRequiredMarkerSelector_(key));
      if (required) {
        $marker.show();
      } else {
        $marker.hide();
      }
      $input.prop('disabled', !required);
      if (required) {
        if (strategyCreateText_($input.val()) === 'NA') $input.val('');
      } else {
        $input.val('NA');
      }
    }
  }

  /* 根据当前 策略/是否创工单 重新应用条件字段状态 */
  function applyStrategyCreateConditionalState($) {
    var values = collectStrategyFormValues($);
    var isRbm = strategyCreateText_(values['策略 / Strategy']) === 'RBM';
    var isWorkOrder = strategyCreateText_(values['是否创工单']) === 'Y';
    applyStrategyCreateConditionalGroup_($, STRATEGY_RBM_CONDITIONAL_KEYS, isRbm);
    applyStrategyCreateConditionalGroup_($, [STRATEGY_WORK_ORDER_KEY], isWorkOrder);
    updateStrategyMandatoryFrequency($);
  }

  /* 清空表单与频率高亮 */
  function resetStrategyCreateForm($) {
    var fields = typeof STRATEGY_FIELDS !== 'undefined' && STRATEGY_FIELDS ? STRATEGY_FIELDS : [];
    for (var i = 0; i < fields.length; i++) {
      $(strategyCreateFieldSelector_(fields[i].key)).val('');
    }
    $(strategyCreateFieldSelector_('TasklistName')).val(null).trigger('change');
    $(strategyCreateFieldSelector_('强制保养频率/ Month')).removeClass('bg-warning');
    $('#changeReason').val('');
    applyStrategyCreateConditionalState($);
  }

  /* 同工序+机型下是否存在相同（trim 后）PM Description 的行 */
  function strategyCreateHasDuplicateDescription_(rows, process, machineType, description) {
    var filtered = typeof filterStrategyMasterRows === 'function'
      ? filterStrategyMasterRows(rows, process, machineType)
      : (Array.isArray(rows) ? rows : []);
    var target = strategyCreateText_(description);
    if (target === '') return false;
    for (var i = 0; i < filtered.length; i++) {
      if (strategyCreateText_(filtered[i]['PM Description']) === target) return true;
    }
    return false;
  }

  /* 失败提示：把后端「中文 / English」消息拆成双语 swalHtml */
  function showStrategyCreateError_(message) {
    var text = strategyCreateText_(message);
    var cn = '后端返回异常，请重试。';
    var en = 'Backend error, please retry.';
    if (text !== '') {
      cn = text;
      en = text;
      var parts = text.split(' / ');
      if (parts.length >= 2) {
        cn = parts[0];
        en = parts.slice(1).join(' / ');
      }
    }
    Swal.close();
    Swal.fire({
      icon: 'error',
      title: swalTitle('操作失败', 'Failed'),
      html: swalHtml(cn, en),
      confirmButtonText: '确定 / OK'
    });
  }

  /* 调用 submitStrategyNew；成功后清空表单 */
  function submitStrategyCreatePayload_($, payload) {
    Swal.fire({
      title: swalTitle('请等待', 'Please Wait'),
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => Swal.showLoading()
    });
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) {
          Swal.close();
          Swal.fire({
            icon: 'success',
            title: swalTitle('提交成功', 'Submitted'),
            timer: 1500,
            showConfirmButton: false
          });
          resetStrategyCreateForm($);
        } else {
          showStrategyCreateError_(r && r.message ? r.message : '');
        }
      })
      .withFailureHandler(function () {
        showStrategyCreateError_('后端返回异常，请重试。/ Backend error, please retry.');
      })
      .submitStrategyNew(payload);
  }

  /* 重复描述确认：提示但允许继续 */
  function confirmStrategyCreateDuplicate_($, payload) {
    Swal.fire({
      icon: 'warning',
      title: swalTitle('重复提示', 'Duplicate Found'),
      html: swalHtml('该机型已有相同描述的保养策略，是否继续？', 'A strategy with the same PM Description already exists for this machine type. Continue?'),
      showCancelButton: true,
      confirmButtonText: '继续提交 / Continue',
      cancelButtonText: '取消 / Cancel',
      confirmButtonColor: '#E60012'
    }).then(function (result) {
      if (result.isConfirmed) submitStrategyCreatePayload_($, payload);
    });
  }

  /* 提交入口：校验必填 → 查主数据重复 → 提交 */
  function handleStrategyCreateSubmit($) {
    var values = collectStrategyFormValues($);
    var payload = buildStrategyCreatePayload(values, {
      jobNumber: typeof STRATEGY_JOB_NUMBER !== 'undefined' ? STRATEGY_JOB_NUMBER : '',
      name: typeof STRATEGY_USER_NAME !== 'undefined' ? STRATEGY_USER_NAME : ''
    }, $('#changeReason').val());

    if (payload === null) {
      Swal.fire({
        icon: 'error',
        title: swalTitle('填写不完整', 'Incomplete Form'),
        html: swalHtml('请填写所有必填字段及变更原因。', 'Please fill in all required fields and the change reason.'),
        confirmButtonText: '确定 / OK'
      });
      return;
    }

    Swal.fire({
      title: swalTitle('检查中', 'Checking'),
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => Swal.showLoading()
    });

    google.script.run
      .withSuccessHandler(function (r) {
        Swal.close();
        var rows = r && r.rows ? r.rows : [];
        var duplicate = strategyCreateHasDuplicateDescription_(
          rows,
          values['工序'],
          values['Machine Type'],
          values['PM Description']
        );
        if (duplicate) {
          confirmStrategyCreateDuplicate_($, payload);
        } else {
          submitStrategyCreatePayload_($, payload);
        }
      })
      .withFailureHandler(function () {
        // 主数据读取失败不阻塞新建提交
        Swal.close();
        submitStrategyCreatePayload_($, payload);
      })
      .getStrategyMasterData();
  }

  /* 页面初始化 */
  function initStrategyCreatePage($) {
    renderStrategyForm($);
    initStrategyCreateTasklistSelect2_($, $(strategyCreateFieldSelector_('TasklistName')));
    loadStrategyCreateTasklistOptions($);
    applyStrategyCreateConditionalState($);

    var userName = typeof STRATEGY_USER_NAME !== 'undefined' && STRATEGY_USER_NAME ? String(STRATEGY_USER_NAME) : '';
    var jobNumber = typeof STRATEGY_JOB_NUMBER !== 'undefined' && STRATEGY_JOB_NUMBER ? String(STRATEGY_JOB_NUMBER) : '';
    $('#Name').text(userName === '' ? '-' : userName);
    $('#JobNumber').text(jobNumber);

    $('#strategyForm').on('input change', strategyCreateFieldSelector_('PM Frequency'), function () {
      updateStrategyMandatoryFrequency($);
    });
    $('#strategyForm').on('change', strategyCreateFieldSelector_('策略 / Strategy'), function () {
      applyStrategyCreateConditionalState($);
    });
    $('#strategyForm').on('change', strategyCreateFieldSelector_('是否创工单'), function () {
      applyStrategyCreateConditionalState($);
    });

    $('#submitStrategy').on('click', function () {
      handleStrategyCreateSubmit($);
    });

    $('#resetStrategyForm').on('click', function () {
      resetStrategyCreateForm($);
    });
  }

  if (typeof $ !== 'undefined') {
    $(document).ready(function () {
      initStrategyCreatePage($);
    });
  }
</script>

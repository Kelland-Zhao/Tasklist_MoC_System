<script>
  /* EDS §8.1 双语 helper */
  const swalTitle = (cn, en) => `${cn}<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">${en}</span>`;
  const swalHtml  = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;

  $(document).ready(() => {
    let title = $('#title').text();
    let styledText1 = '<span style="color: red; font-weight: bold;">点检</span>';
    let styledText2 = '<span style="color: red; font-weight: bold;font-style:italic;">Inspection</span>';
    let newText = title.replace('点检', styledText1).replace('Inspection', styledText2);
    $('#title').html(newText)

    Swal.fire({
      title: swalTitle('页面加载中','Page Loading'),
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => Swal.showLoading()
    });
    var table = $('#table').DataTable({

      columns: [
        { data: 'MachineType' },
        { data: 'Operator' },
        { data: 'Reason' },
        { data: 'Approver1' },
        { data: 'Comment1' },
        { data: 'Approver2' },
        { data: 'Comment2' },
        { data: 'Dissminater' },
        { data: 'Status' },
        {
          data: 'submitMail',
          "visible": false
        }
      ],
      columnDefs: [
        {
          targets: 10, // 最后3列的索引
          render: function (data, type, row, meta) {
            return '<button class="btn btn-info btn-sm" title="任务清单 / Detail Tasklist"><i class="bi bi-list-ul"></i></button>';
          }
        }
      ],
      pageLength: 50
    });


    google.script.run.withSuccessHandler((r) => {
      if (r.length == 2) {
        Swal.close();
        Swal.fire({
          icon: 'success',
          title: swalTitle('加载成功','Loading Success'),
          timer: 1500,
          showConfirmButton: false
        });

        let objArrayApprovallist = r[0];

        let mail = r[1];

        console.log(r);

        let effectiveItem = objArrayApprovallist.filter((r) => { return r.Status === "生效/ Effective" });

        effectiveItem.forEach((r) => {

          r['Reason'] = formatText(r['Reason']);

        })

        table.clear().draw();

        table.rows.add(effectiveItem).draw();

        $("#Name").text(mail);

        let tableHTML = '<div style="text-align:right;margin-bottom:10px;">'
          + '<button type="button" id="exportPdfBtn" class="btn btn-sm" style="background:#E60012;border-color:#E60012;color:#fff;" title="打印或另存为 PDF / Print or Save as PDF">'
          + '<i class="bi bi-printer"></i> 导出 PDF / Export PDF'
          + '</button></div>'
          + '<table id="diffTable" class="display" style="width:100%">';
        tableHTML += "<thead>"
        tableHTML += "<tr>"
        tableHTML += "<th>单元<br><small>Unit</small></th>"
        tableHTML += "<th>部位及内容<br><small>Parts</small></th>"
        tableHTML += "<th>检查标准<br><small>Inspection Std</small></th>"
        tableHTML += "<th>使用工具<br><small>Tool</small></th>"
        tableHTML += "<th>方法<br><small>Method</small></th>"
        tableHTML += "<th>设备状态<br><small>Status</small></th>"
        tableHTML += "<th>检查频率<br><small>Frequency</small></th>"
        tableHTML += "<th>适用机型<br><small>Machine Type</small></th>"
        tableHTML += "<th>执行人<br><small>Resource</small></th>"
        tableHTML += "<th>工序<br><small>Process</small></th>"
        tableHTML += "</tr>"
        tableHTML += "</thead>"
        tableHTML += "</table>"


        let diffTableData = [];

        $("#table tbody").on('click', '.btn-info', function () {
          Swal.fire({ title: swalTitle('任务清单', 'Tasklist'), html: tableHTML, width: '90%', showConfirmButton: false, showCloseButton: true });
          // 获取当前行的数据
          let rowData = table.row($(this).closest('tr')).data();

          // 提取申请人/ Editor 信息
          let editor = rowData['Operator'];
          let item = r[0].filter((r) => { return r.Operator == editor });
          let tasklist = JSON.parse(item[0].Tasklist);
          // console.log(tasklist);

          $('#exportPdfBtn').off('click').on('click', function () {
            const rows = tasklist.map((t) => IN_PRINT_KEYS.map((k) => t[k]));
            const ok = openPrintWindow({
              title: buildPrintFileName('点检', rowData['MachineType'], new Date()),
              headers: IN_PRINT_HEADERS,
              rows: rows
            });
            if (!ok) {
              Swal.fire({
                icon: 'warning',
                title: swalTitle('打印窗口被拦截', 'Popup Blocked'),
                html: swalHtml('请允许本网站弹出窗口后重试。', 'Please allow popups for this site and retry.'),
                confirmButtonText: '确定 / OK'
              });
            }
          });

          let diffTable = $('#diffTable').DataTable({
            destroy: true,
            columns: [
              { data: 'Unit' },
              { data: 'Parts' },
              { data: 'Inspection Std' },
              { data: 'Tool' },
              { data: 'Method' },
              { data: 'Status' },
              { data: 'Frequency' },
              { data: 'Machine Type' },
              { data: 'Resource' },
              { data: 'Process' }

            ],
            pageLength: 100
          });
          diffTable.clear().rows.add(tasklist).draw(); // 填充并绘制 diffTable

        })

      } else {
        Swal.close();
        Swal.fire({
          icon: 'error',
          title: swalTitle('加载失败','Loading Failed'),
          html: swalHtml('数据加载异常，请刷新页面重试。','Data loading error. Please refresh and retry.'),
          confirmButtonText: '确定 / OK'
        });
      };

    }).getEffectiveData_IN()
  })



  /* 打印 / 导出 PDF：任务清单列定义 */
  const IN_PRINT_HEADERS = [
    { cn: '单元', en: 'Unit', width: '30mm', align: 'left' },
    { cn: '部位及内容', en: 'Parts', width: '40mm', align: 'left' },
    { cn: '检查标准', en: 'Inspection Std', width: '58mm', align: 'left' },
    { cn: '使用工具', en: 'Tool', width: '24mm' },
    { cn: '方法', en: 'Method', width: '26mm' },
    { cn: '设备状态', en: 'Status', width: '22mm' },
    { cn: '检查频率', en: 'Frequency', width: '20mm' },
    { cn: '适用机型', en: 'Machine Type', width: '22mm' },
    { cn: '执行人', en: 'Resource', width: '20mm' },
    { cn: '工序', en: 'Process', width: '17mm' }
  ];

  const IN_PRINT_KEYS = [
    'Unit', 'Parts', 'Inspection Std', 'Tool', 'Method', 'Status', 'Frequency',
    'Machine Type', 'Resource', 'Process'
  ];

  function formatText(text) {
    // 定义固定字段
    const keywords = [
      "新增条目",
      "删除条目",
      "修改条目"
    ];

    // 遍历每个固定字段，在其前面添加换行符
    keywords.forEach(keyword => {
      text = text.replace(keyword, "\n" + keyword);
    });

    // 去掉文本最开始的换行符（如果存在的话）
    text = text.trimStart();

    // 将文本中的 \n 转换为 <br> 以用于 HTML 显示
    return text.replace(/\n/g, "<br>");
  }























































</script>

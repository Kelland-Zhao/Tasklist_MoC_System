<script>
  /* EDS §8.1 双语 helper */
  const swalTitle = (cn, en) => `${cn}<span style="display:block;font-size:0.65em;color:#888;font-weight:400;line-height:1.3;margin-top:4px;">${en}</span>`;
  const swalHtml  = (cn, en) => `<div>${cn}<div style="font-size:0.85em;color:#888;margin-top:6px;line-height:1.4;">${en}</div></div>`;

  $(document).ready(() => {
    let title = $('#title').text();
    let styledText1 = '<span style="color: red; font-weight: bold;">保养</span>';
    let styledText2 = '<span style="color: red; font-weight: bold;font-style:italic;">PM</span>';
    let newText = title.replace('保养', styledText1).replace('PM', styledText2);
    $('#title').html(newText)

    Swal.fire({
      title: swalTitle('页面加载中','Page Loading'),
      allowOutsideClick: false,
      showConfirmButton: false,
      didOpen: () => Swal.showLoading()
    });
    var table = $('#table').DataTable({

      columns: [
        { data: 'MachineType' },
        { data: 'Operator' },
        { data: 'Reason' },
        { data: 'Approver1' },
        { data: 'Comment1' },
        { data: 'Approver2' },
        { data: 'Comment2' },
        { data: 'Dissminater' },
        { data: 'Status' },
        {
          data: 'submitMail',
          "visible": false
        }
      ],
      columnDefs: [
        {
          targets: 10, // 最后3列的索引
          render: function (data, type, row, meta) {
            return '<button class="btn btn-info btn-sm" title="任务清单 / Detail Tasklist"><i class="bi bi-list-ul"></i></button> '
              + '<button class="btn btn-outline-secondary btn-sm btn-version-history" title="版本历史 / Version History"><i class="bi bi-clock-history"></i></button>';
          }
        }
      ],
      pageLength: 50
    });


    google.script.run.withSuccessHandler((r) => {
      if (r.length == 2) {
        Swal.close();
        Swal.fire({
          icon: 'success',
          title: swalTitle('加载成功','Loading Success'),
          timer: 1500,
          showConfirmButton: false
        });

        let objArrayApprovallist = r[0];

        let mail = r[1];

        // console.log("all tasklist",r);

        let effectiveItem = objArrayApprovallist.filter((r) => { return r.Status === "生效/ Effective" });

        let tasklist_6AX = objArrayApprovallist.filter((r) => { return r.MachineType === "6AX" });

        console.log('tasklist_6AX', tasklist_6AX);

        effectiveItem.forEach((r) => {

          r['Reason'] = formatText(r['Reason']);

        })

        // console.log('effectiveItem-2', effectiveItem);


        table.clear().draw();

        table.rows.add(effectiveItem).draw();

        $("#Name").text(mail);

        let tableHTML = '<div style="text-align:right;margin-bottom:10px;">'
          + '<button type="button" id="exportPdfBtn" class="btn btn-sm" style="background:#E60012;border-color:#E60012;color:#fff;" title="打印或另存为 PDF / Print or Save as PDF">'
          + '<i class="bi bi-printer"></i> 导出 PDF / Export PDF'
          + '</button></div>'
          + '<table id="diffTable" class="display" style="width:100%">';
        tableHTML += "<thead>"
        tableHTML += "<tr>"
        tableHTML += "<th>机型<br><small>Machine Type</small></th>"
        tableHTML += "<th>任务编号<br><small>Task No.</small></th>"
        tableHTML += "<th>单元<br><small>Section</small></th>"
        tableHTML += "<th>功能<br><small>Function</small></th>"
        tableHTML += "<th>失效模式<br><small>Failure Mode</small></th>"
        tableHTML += "<th>任务类型<br><small>Task Type</small></th>"
        tableHTML += "<th>任务描述<br><small>Task Description</small></th>"
        tableHTML += "<th>频率<br><small>Frecuency</small></th>"
        tableHTML += "<th>设备状态<br><small>Line Status</small></th>"
        tableHTML += "<th>保养策略<br><small>Strategy</small></th>"
        tableHTML += "<th>执行人<br><small>Resource</small></th>"
        tableHTML += "<th>人数<br><small>No. Resources</small></th>"
        tableHTML += "<th>技能等级<br><small>Skill Level</small></th>"
        tableHTML += "<th>技能<br><small>Tools & Equip</small></th>"
        tableHTML += "<th>预估时间<br><small>Estimated Time</small></th>"
        tableHTML += "</tr>"
        tableHTML += "</thead>"
        tableHTML += "</table>"


        let diffTableData = [];

        $("#table tbody").on('click', '.btn-info', function () {
          Swal.fire({ title: swalTitle('任务清单', 'Tasklist'), html: tableHTML, width: '90%', showConfirmButton: false, showCloseButton: true });
          // 获取当前行的数据
          let rowData = table.row($(this).closest('tr')).data();

          // 提取申请人/ Editor 信息
          let editor = rowData['Operator'];
          let item = r[0].filter((r) => { return r.Operator == editor });
          let tasklist = JSON.parse(item[0].Tasklist);
          // console.log(tasklist);

          $('#exportPdfBtn').off('click').on('click', function () {
            const rows = tasklist.map((t) => PM_PRINT_KEYS.map((k) => t[k]));
            const ok = openPrintWindow({
              title: buildPrintFileName('保养', rowData['MachineType'], new Date()),
              heading: '保养任务清单',
              headers: PM_PRINT_HEADERS,
              rows: rows
            });
            if (!ok) {
              Swal.fire({
                icon: 'warning',
                title: swalTitle('打印窗口被拦截', 'Popup Blocked'),
                html: swalHtml('请允许本网站弹出窗口后重试。', 'Please allow popups for this site and retry.'),
                confirmButtonText: '确定 / OK'
              });
            }
          });

          let diffTable = $('#diffTable').DataTable({
            destroy: true,
            columns: [
              { data: 'MachineType' },
              { data: 'Task No' },
              { data: 'Section' },
              { data: 'Function' },
              { data: 'Failure Mode' },
              { data: 'Task Type' },
              { data: 'Task Description' },
              { data: 'Frecuency' },
              { data: 'Line Status' },
              { data: 'Strategy' },
              { data: 'Resource' },
              { data: 'No Resources' },
              { data: 'Skill Level' },
              { data: 'Tools & Equip' },
              { data: 'Estimated Time' }
            ],
            pageLength: 100
          });
          diffTable.clear().rows.add(tasklist).draw(); // 填充并绘制 diffTable

        })

        $("#table tbody").on('click', '.btn-version-history', function () {
          var rowData = table.row($(this).closest('tr')).data();
          showTasklistVersionHistory_(r[0], rowData['MachineType']);
        })

      } else {
        Swal.close();
        Swal.fire({
          icon: 'error',
          title: swalTitle('加载失败','Loading Failed'),
          html: swalHtml('数据加载异常，请刷新页面重试。','Data loading error. Please refresh and retry.'),
          confirmButtonText: '确定 / OK'
        });
      };

    }).getEffectiveData()
  })


  /* 打印 / 导出 PDF：任务清单列定义 */
  const PM_PRINT_HEADERS = [
    { cn: '机型', en: 'Machine Type', width: '16mm' },
    { cn: '任务编号', en: 'Task No.', width: '16mm' },
    { cn: '单元', en: 'Section', width: '24mm', align: 'left' },
    { cn: '功能', en: 'Function', width: '22mm', align: 'left' },
    { cn: '失效模式', en: 'Failure Mode', width: '24mm', align: 'left' },
    { cn: '任务类型', en: 'Task Type', width: '20mm' },
    { cn: '任务描述', en: 'Task Description', width: '34mm', align: 'left' },
    { cn: '频率', en: 'Frecuency', width: '14mm' },
    { cn: '设备状态', en: 'Line Status', width: '14mm' },
    { cn: '保养策略', en: 'Strategy', width: '20mm', align: 'left' },
    { cn: '执行人', en: 'Resource', width: '14mm' },
    { cn: '人数', en: 'No. Resources', width: '10mm' },
    { cn: '技能等级', en: 'Skill Level', width: '12mm' },
    { cn: '技能', en: 'Tools & Equip', width: '20mm', align: 'left' },
    { cn: '预估时间', en: 'Estimated Time', width: '17mm' }
  ];

  const PM_PRINT_KEYS = [
    'MachineType', 'Task No', 'Section', 'Function', 'Failure Mode', 'Task Type',
    'Task Description', 'Frecuency', 'Line Status', 'Strategy', 'Resource',
    'No Resources', 'Skill Level', 'Tools & Equip', 'Estimated Time'
  ];

  /* 版本历史弹窗：列出该机型全部历史版本，每个版本可展开查看任务清单 */
  function showTasklistVersionHistory_(historyRows, machineType) {
    var versions = machineVersionRows_(historyRows, machineType);
    var html = '<div style="text-align:left;">';
    html += '<div style="margin-bottom:10px;font-size:13px;color:#555;">机型 / Machine Type：<strong>'
      + versionHistoryEscape_(machineType) + '</strong> · 共 ' + versions.length + ' 个版本</div>';
    if (versions.length === 0) {
      html += '<div class="text-muted">暂无历史版本 / No version history</div>';
    } else {
      for (var i = 0; i < versions.length; i++) {
        var version = versions[i] || {};
        var applicant = versionHistoryParseOperator_(version.Operator);
        var reasonText = String(version.Reason || '').replace(/<br\s*\/?>/gi, '\n');
        var tasklist = [];
        try { tasklist = JSON.parse(version.Tasklist); } catch (e) { tasklist = []; }
        html += '<div style="border:1px solid #e9ecef;border-radius:6px;padding:10px 12px;margin-bottom:10px;">';
        html += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">'
          + versionHistoryStatusBadge_(version.Status)
          + '<strong>' + versionHistoryEscape_(applicant.name || '-') + '</strong>'
          + '<span style="color:#888;font-size:12px;">' + versionHistoryEscape_(applicant.timestamp) + '</span>'
          + '</div>';
        if (reasonText !== '') {
          html += '<div style="margin-top:6px;font-size:13px;white-space:pre-line;">变更原因：'
            + versionHistoryEscape_(reasonText) + '</div>';
        }
        html += '<details style="margin-top:8px;"><summary style="cursor:pointer;color:#0d6efd;font-size:13px;">'
          + '查看任务清单 / View Tasklist</summary>';
        html += versionHistoryTableHtml_(PM_PRINT_HEADERS, tasklist, PM_PRINT_KEYS);
        html += '</details></div>';
      }
    }
    html += '</div>';
    Swal.fire({
      title: swalTitle('版本历史', 'Version History'),
      html: html,
      width: '90%',
      showCloseButton: true,
      showConfirmButton: false
    });
  }

  function formatText(text) {    // 定义固定字段
    const keywords = [
      "新增条目",
      "删除条目",
      "修改条目"
    ];

    // 遍历每个固定字段，在其前面添加换行符
    keywords.forEach(keyword => {
      text = text.replace(keyword, "\n" + keyword);
    });

    // 去掉文本最开始的换行符（如果存在的话）
    text = text.trimStart();

    // 将文本中的 \n 转换为 <br> 以用于 HTML 显示
    return text.replace(/\n/g, "<br>");
  }
























































</script>

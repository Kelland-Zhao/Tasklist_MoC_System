<script>
  /* 保养清单测量配置 — 编辑/新建页共用纯函数 */

  function measurementConfigText_(value) {
    return value === null || value === undefined ? '' : String(value).trim();
  }

  function measurementConfigPdMYes_(value) {
    const text = measurementConfigText_(value);
    return text === '是/ Yes' || text === '是' || text === 'Yes';
  }

  function normalizeMeasurementPointsText_(value) {
    return measurementConfigText_(value).replace(/，/g, ',');
  }

  function parseMeasurementPoints_(value) {
    const text = normalizeMeasurementPointsText_(value);
    const result = [];
    if (text === '') return result;
    const seen = new Set();
    text.split(',').forEach((part) => {
      const code = part.trim();
      if (code === '' || seen.has(code)) return;
      seen.add(code);
      result.push({ code: code });
    });
    return result;
  }

  function parsePointLabels_(value) {
    const text = measurementConfigText_(value);
    const result = {};
    if (text === '') return result;
    text.split(';').forEach((part) => {
      const index = part.indexOf('=');
      if (index <= 0) return;
      const code = part.slice(0, index).trim();
      const label = part.slice(index + 1).trim();
      if (code !== '') result[code] = label;
    });
    return result;
  }

  function validateMeasurementConfig_(task) {
    const source = task || {};
    const errors = [];
    if (!measurementConfigPdMYes_(source['PdM?'])) return errors;

    const points = parseMeasurementPoints_(source['Measurement Points']);
    const labels = parsePointLabels_(source['Point Labels']);
    const unit = measurementConfigText_(source['Measurement Unit']);

    if (points.length === 0) {
      errors.push({ field: 'Measurement Points', message: '至少填写一个测点 / At least one point required' });
    }
    if (unit === '') {
      errors.push({ field: 'Measurement Unit', message: '测量单位必填 / Measurement unit required' });
    }
    if (points.length > 0 && Object.keys(labels).length === 0) {
      errors.push({ field: 'Point Labels', message: '测点位置必填 / Point labels required' });
    }
    points.forEach((point) => {
      if (!labels[point.code]) {
        errors.push({ field: 'Point Labels', message: '缺少测点位置: ' + point.code });
      }
    });
    return errors;
  }

  function buildPdMSummary_(task) {
    const source = task || {};
    if (!measurementConfigPdMYes_(source['PdM?'])) return '—';
    const points = parseMeasurementPoints_(source['Measurement Points']);
    if (points.length === 0) return '—';
    const unit = measurementConfigText_(source['Measurement Unit']);
    const label = points.length === 1
      ? points[0].code
      : points[0].code + '-' + points[points.length - 1].code;
    return label + (unit === '' ? '' : ' · ' + unit);
  }

  /**
   * 配置列三态：未启用 / 未启用（已保存配置）/ 待配置 / 已完成。
   * @param {Object} task
   * @returns {{enabled:boolean, hasConfig:boolean, complete:boolean, summary:string}}
   */
  function measurementConfigState_(task) {
    const source = task || {};
    const enabled = measurementConfigPdMYes_(source['PdM?']);
    const hasConfig = parseMeasurementPoints_(source['Measurement Points']).length > 0
      || measurementConfigText_(source['Point Labels']) !== ''
      || measurementConfigText_(source['Measurement Unit']) !== '';
    if (!enabled) {
      return {
        enabled: false,
        hasConfig: hasConfig,
        complete: false,
        summary: hasConfig ? '未启用（已保存配置）/ Inactive (saved)' : '未启用 / Inactive'
      };
    }
    const complete = validateMeasurementConfig_(source).length === 0;
    return {
      enabled: true,
      hasConfig: hasConfig,
      complete: complete,
      summary: complete ? buildPdMSummary_(source) : '待配置 / Incomplete'
    };
  }

  function measurementConfigEscape_(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function buildPdMConfigField_(id, label, value, options) {
    const opts = options || {};
    const required = opts.required ? '<span style="color:#E60012;margin-left:2px;">*</span>' : '';
    const placeholder = opts.placeholder ? ' placeholder="' + measurementConfigEscape_(opts.placeholder) + '"' : '';
    const type = opts.type ? ' type="' + opts.type + '"' : '';
    const step = opts.step ? ' step="' + opts.step + '"' : '';
    const help = opts.help ? '<div style="font-size:11px;color:#888;margin-top:2px;">' + opts.help + '</div>' : '';
    return '<div class="' + (opts.col || 'col-12') + '"><label style="display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:2px;">'
      + label + required + '</label><input id="' + id + '" class="form-control form-control-sm"' + type + step + placeholder
      + ' value="' + measurementConfigEscape_(value) + '">' + help + '</div>';
  }

  // 下拉字段：Logic 保留原表格的选择形式，历史非标准值保留为选中项
  function buildPdMConfigSelect_(id, label, value, options, extra) {
    const opts = extra || {};
    const current = measurementConfigText_(value);
    const list = (options || []).slice();
    if (current !== '' && list.indexOf(current) === -1) list.push(current);
    const required = opts.required ? '<span style="color:#E60012;margin-left:2px;">*</span>' : '';
    let html = '<div class="' + (opts.col || 'col-12') + '"><label style="display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:2px;">'
      + label + required + '</label><select id="' + id + '" class="form-select form-select-sm">'
      + '<option value="">请选择/ Please select</option>';
    list.forEach(function (option) {
      const selected = option === current ? ' selected' : '';
      html += '<option value="' + measurementConfigEscape_(option) + '"' + selected + '>' + measurementConfigEscape_(option) + '</option>';
    });
    html += '</select></div>';
    return html;
  }

  function buildPdMConfigSection_(cn, en) {
    return '<div style="font-size:13px;font-weight:700;color:#6c757d;letter-spacing:1px;margin:16px 0 8px;border-left:3px solid #E60012;padding-left:10px;">'
      + cn + ' / ' + en + '</div>';
  }

  // 按 Measurement Points 生成每个测点的位置输入框
  function buildPointLabelInputsHtml_(pointsValue, labelsValue) {
    const points = parseMeasurementPoints_(pointsValue);
    const labels = parsePointLabels_(labelsValue);
    if (points.length === 0) {
      return '<div style="font-size:12px;color:#888;padding:4px 0;">请先填写测点（Measurement Points），再填写各测点位置。</div>';
    }
    return '<div class="row g-2">' + points.map(function (point) {
      const value = labels[point.code] === undefined ? '' : labels[point.code];
      return '<div class="col-6"><label style="display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:2px;">'
        + measurementConfigEscape_(point.code) + ' · 位置 / Label</label>'
        + '<input class="form-control form-control-sm pdm-point-label" data-point="' + measurementConfigEscape_(point.code)
        + '" placeholder="如 操作侧" value="' + measurementConfigEscape_(value) + '"></div>';
    }).join('') + '</div>';
  }

  // 把测点位置输入框拼回存储格式：S1=操作侧;S2=非操作侧
  function composePointLabels_(pointsValue, labelsByCode) {
    const byCode = labelsByCode || {};
    return parseMeasurementPoints_(pointsValue).map(function (point) {
      const value = byCode[point.code] === null || byCode[point.code] === undefined ? '' : String(byCode[point.code]).trim();
      return point.code + '=' + value;
    }).join(';');
  }

  function buildPdMConfigModalHtml_(task) {
    const source = task || {};
    const logicOptions = [
      'HighAlarm_Max', 'HighAlarm_Min', 'HighAlarm_Average', 'HighAlarm_Slope',
      'LowAlarm_Max', 'LowAlarm_Min', 'LowAlarm_Average', 'LowAlarm_Slope',
      'Out_of_range'
    ];
    const unitOptions = [
      'kN', '吨力', 'με', 'mm/s', 'μm', 'mm',
      '°C', 'MPa', 'bar', 'N·m', 'rpm',
      'A', 'V', 'Hz', '%'
    ];
    return '<div style="font-size:13px;max-height:60vh;overflow-y:auto;overflow-x:hidden;text-align:left;padding:0 12px 4px;">'
      + buildPdMConfigSection_('测量对象', 'MEASUREMENT OBJECT')
      + '<div class="row g-3">'
      + buildPdMConfigField_('pdmUnit', 'Unit / 测量单元', source['Unit'], { required: true, placeholder: '如 哥林柱', col: 'col-md-4' })
      + buildPdMConfigField_('pdmComponent', 'Component / 部件', source['Component'], { required: true, placeholder: '如 锁模机构', col: 'col-md-4' })
      + buildPdMConfigField_('pdmTagName', 'TagName / 标签', source['TagName'], { required: true, placeholder: '如 哥林柱拉伸变形量', col: 'col-md-4' })
      + '</div>'
      + buildPdMConfigSection_('判定规则', 'LIMIT RULES')
      + '<div class="row g-3">'
      + buildPdMConfigSelect_('pdmLogic', 'Logic / 逻辑', source['Logic'], logicOptions, { required: true, col: 'col-md-6' })
      + buildPdMConfigField_('pdmLL', 'LL Limited / 低限值（可空）', source['LL Limited'], { type: 'number', step: 'any', placeholder: '可空', col: 'col-md-3' })
      + buildPdMConfigField_('pdmHH', 'HH Limited / 高限值（可空）', source['HH Limited'], { type: 'number', step: 'any', placeholder: '可空', col: 'col-md-3' })
      + '<div class="col-12"><div style="font-size:11px;color:#888;">留空 = 待判定；任一测点超限即不合格，超限时结束保养需填写异常措施。</div></div>'
      + '</div>'
      + buildPdMConfigSection_('测量要求', 'MEASUREMENT REQUIREMENT')
      + '<div class="row g-3">'
      + buildPdMConfigField_('pdmPoints', 'Measurement Points / 测点', source['Measurement Points'], { required: true, placeholder: '如 S1,S2,S3,S4', col: 'col-md-8', help: '多个测点请用英文逗号「,」分隔（如 S1,S2,S3,S4）' })
      + buildPdMConfigSelect_('pdmUnitPhysical', 'Measurement Unit / 物理单位', source['Measurement Unit'], unitOptions, { required: true, col: 'col-md-4' })
      + '<div class="col-12"><label style="display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:2px;">Point Labels / 位置'
      + '<span style="color:#E60012;margin-left:2px;">*</span></label><div id="pdmLabelsContainer">'
      + buildPointLabelInputsHtml_(source['Measurement Points'], source['Point Labels'])
      + '</div></div>'
      + '</div>'
      + '</div>';
  }

  function openPdMConfigModal_(row, table, options) {
    const opts = options || {};
    const source = row.data();
    const copy = Object.assign({}, source);
    const html = buildPdMConfigModalHtml_(source);
    Swal.fire({
      title: swalTitle('PdM 配置', 'PdM Setup'),
      html: html,
      width: 'min(760px, 92vw)',
      showCloseButton: true,
      showCancelButton: true,
      confirmButtonText: '保存 / Save',
      cancelButtonText: '取消 / Cancel',
      confirmButtonColor: '#E60012',
      didOpen: function () {
        const root = Swal.getHtmlContainer();
        const pointsInput = root.querySelector('#pdmPoints');
        const labelsContainer = root.querySelector('#pdmLabelsContainer');
        if (!pointsInput || !labelsContainer) return;
        pointsInput.addEventListener('input', function () {
          const current = {};
          labelsContainer.querySelectorAll('.pdm-point-label').forEach(function (input) {
            current[input.getAttribute('data-point')] = input.value;
          });
          labelsContainer.innerHTML = buildPointLabelInputsHtml_(
            pointsInput.value,
            composePointLabels_(pointsInput.value, current)
          );
        });
      }
    }).then(function (result) {
      if (!result.isConfirmed) {
        // 由「否→是」触发的配置：取消则整体回滚，避免留下「是 + 空配置」
        if (opts.revertOnCancel && opts.original) {
          row.data(Object.assign({}, opts.original)).draw(false);
        }
        return;
      }
      const root = Swal.getHtmlContainer();
      copy['Unit'] = root.querySelector('#pdmUnit').value.trim();
      copy['Component'] = root.querySelector('#pdmComponent').value.trim();
      copy['TagName'] = root.querySelector('#pdmTagName').value.trim();
      copy['Logic'] = root.querySelector('#pdmLogic').value.trim();
      copy['LL Limited'] = root.querySelector('#pdmLL').value.trim();
      copy['HH Limited'] = root.querySelector('#pdmHH').value.trim();
      copy['Measurement Points'] = normalizeMeasurementPointsText_(root.querySelector('#pdmPoints').value);
      const labelsByCode = {};
      root.querySelectorAll('.pdm-point-label').forEach(function (input) {
        labelsByCode[input.getAttribute('data-point')] = input.value.trim();
      });
      copy['Point Labels'] = composePointLabels_(copy['Measurement Points'], labelsByCode);
      copy['Measurement Unit'] = root.querySelector('#pdmUnitPhysical').value.trim();
      const errors = validateMeasurementConfig_(copy);
      if (errors.length > 0) {
        Swal.fire({
          icon: 'warning',
          title: swalTitle('配置不完整', 'Incomplete Config'),
          html: '<div style="text-align:left;font-size:13px;line-height:1.7;">'
            + errors.map(function (e) { return measurementConfigEscape_(e.message); }).join('<br>') + '</div>',
          confirmButtonText: '确定 / OK'
        });
        return;
      }
      row.data(copy).draw(false);
      Swal.fire({
        icon: 'success',
        title: swalTitle('已保存', 'Saved'),
        timer: 1500,
        showConfirmButton: false
      });
    });
  }
</script>

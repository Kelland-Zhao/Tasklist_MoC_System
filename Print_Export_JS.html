<script>
  /* 打印 / 导出 PDF 公共逻辑 — 保养、点检查阅页共用 */

  function escapePrintHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function buildDatedFileName(prefix, date) {
    const d = date || new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const ymd = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    return prefix + '_' + ymd;
  }

  function buildPrintFileName(moduleLabel, machineType, date) {
    const mt = String(machineType || '').trim().replace(/[\\/:*?"<>|]/g, '-') || 'NA';
    return buildDatedFileName(moduleLabel + '任务清单_' + mt, date);
  }

  function buildPrintHtml(options) {
    const title = options.title || '';
    const heading = options.heading || '';
    const subheading = options.subheading || '';
    const headers = options.headers || [];
    const rows = options.rows || [];

    const cols = headers
      .map((h) => '<col style="width:' + (h.width || 'auto') + '">')
      .join('');

    const headerCells = headers
      .map(function (h) {
        const en = h.en ? '<small>' + escapePrintHtml(h.en) + '</small>' : '';
        return '<th>' + escapePrintHtml(h.cn) + en + '</th>';
      })
      .join('');

    const bodyRows = rows
      .map(function (row) {
        const cells = headers
          .map(function (h, i) {
            const cls = h.align === 'left' ? ' class="ta-left"' : '';
            return '<td' + cls + '>' + escapePrintHtml(row[i]) + '</td>';
          })
          .join('');
        return '<tr>' + cells + '</tr>';
      })
      .join('');

    return [
      '<!DOCTYPE html>',
      '<html lang="zh-CN">',
      '<head>',
      '<meta charset="UTF-8">',
      '<title>' + escapePrintHtml(title) + '</title>',
      '<style>',
      '  @page { size: A4 landscape; margin: 8mm; }',
      '  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
      '  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; color: #212529; }',
      '  .toolbar { text-align: right; padding: 10px 12px; }',
      '  .doc-title { font-size: 16px; font-weight: 700; text-align: center; margin: 4px 0 8px; }',
      '  .doc-subtitle { font-size: 10px; color: #555; text-align: right; margin: 0 0 6px; }',
      '  .toolbar button { background: #E60012; border: 0; color: #fff; font-size: 14px; padding: 7px 16px; border-radius: 4px; cursor: pointer; }',
      '  table { width: 100%; border-collapse: collapse; table-layout: fixed; }',
      '  thead { display: table-header-group; }',
      '  th { background: #E60012; color: #fff; font-size: 10px; font-weight: 700; padding: 4px 3px; text-align: center; border: 1px solid #c4000f; vertical-align: middle; }',
      '  th small { display: block; font-size: 0.85em; font-weight: 400; opacity: 0.9; }',
      '  td { font-size: 9px; padding: 3px; border: 1px solid #999; text-align: center; vertical-align: middle; word-wrap: break-word; overflow-wrap: break-word; }',
      '  td.ta-left { text-align: left; }',
      '  tbody tr:nth-child(even) td { background: #f5f5f5; }',
      '  tbody tr { page-break-inside: avoid; }',
      '  @media print { .toolbar { display: none; } }',
      '</style>',
      '</head>',
      '<body>',
      '<div class="toolbar"><button type="button" onclick="window.print()">打印 / Print</button></div>',
      heading ? '<h1 class="doc-title">' + escapePrintHtml(heading) + '</h1>' : '',
      subheading ? '<div class="doc-subtitle">' + escapePrintHtml(subheading) + '</div>' : '',
      '<table>',
      '<colgroup>' + cols + '</colgroup>',
      '<thead><tr>' + headerCells + '</tr></thead>',
      '<tbody>' + bodyRows + '</tbody>',
      '</table>',
      '<script>window.addEventListener("load", function () { window.print(); });<\/script>',
      '</body>',
      '</html>',
    ].join('\n');
  }

  function openBlankPrintWindow(title) {
    const win = window.open('', '_blank');
    if (!win) return null;
    try {
      win.document.open();
      win.document.write(
        '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>' +
          escapePrintHtml(title || '') +
          '</title></head><body style="font-family:\'Microsoft YaHei\',\'PingFang SC\',sans-serif;padding:24px;color:#555;">正在生成 PDF… / Preparing PDF…</body></html>'
      );
      win.document.close();
    } catch (e) {
      try { win.close(); } catch (e2) {}
      return null;
    }
    return win;
  }

  function writePrintWindow(win, options) {
    if (!win || win.closed) return false;
    try {
      win.document.open();
      win.document.write(buildPrintHtml(options));
      win.document.close();
      win.focus();
    } catch (e) {
      return false;
    }
    return true;
  }

  function openPrintWindow(options) {
    const win = window.open('', '_blank');
    if (!win) return false;
    return writePrintWindow(win, options);
  }
</script>
